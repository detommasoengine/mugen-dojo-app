<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#000}
  #c{display:block}
</style></head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
// Grayscale sumi enso LUMINANCE MASK: white ink on black paper.
// Dense wet body (pastose ink core) + bristle fiber + dry edges + grain.
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const W = 1024, CX = 512, CY = 512, R = 360;
const A0 = 2.44;                    // ~140deg head
const SPAN = Math.PI * 2 * 0.87;    // ~313deg sweep -> ~47deg opening
const BAND = 96;

g.fillStyle = '#000'; g.fillRect(0, 0, W, W);
g.globalCompositeOperation = 'lighter';
g.lineCap = 'round'; g.lineJoin = 'round';

function rnd(s){ const x = Math.sin(s*127.1+311.7)*43758.5453; return x - Math.floor(x); }
function halfBand(t){
  let w = Math.pow(1 - t, 0.55);
  w = 0.30 + 0.70 * w;
  if (t > 0.82) w *= Math.max(0.05, (1 - t) / 0.18);
  if (t < 0.04) w *= 0.6 + 0.4 * (t / 0.04);
  return BAND * w;
}
const pt = (t, off) => {
  const ang = A0 + t * SPAN;
  const rr = R + off;
  return [CX + Math.cos(ang) * rr, CY + Math.sin(ang) * rr];
};

// --- WET BODY: dense pastose core as a TAPERED filled ribbon ---
// Width follows halfBand(t) -> thins to a point at the tail (clean taper).
const NR = 300;
function ribbon(coreFactor, alpha, seed){
  g.beginPath();
  for (let i = 0; i <= NR; i++){
    const t = i / NR;
    const hb = halfBand(t) * coreFactor;
    const j = Math.sin(t * 34 + seed) * 1.4;
    const [x, y] = pt(t, hb + j);
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  for (let i = NR; i >= 0; i--){
    const t = i / NR;
    const hb = halfBand(t) * coreFactor;
    const j = Math.sin(t * 34 + seed + 5) * 1.4;
    const [x, y] = pt(t, -hb + j);
    g.lineTo(x, y);
  }
  g.closePath();
  g.fillStyle = 'rgba(255,255,255,' + alpha + ')';
  g.fill();
}
// narrow dense core -> wider fainter body: bright inky centre fading to edges,
// tapering to a point at the tail because halfBand -> 0 there.
ribbon(0.30, 0.20, 1);
ribbon(0.46, 0.13, 4);
ribbon(0.62, 0.09, 8);
ribbon(0.78, 0.06, 12);
// extra wet only in the head half (t<0.55), still tapered by halfBand
(function(){
  g.beginPath();
  const cut = 0.55;
  for (let i = 0; i <= NR; i++){
    const t = (i / NR) * cut;
    const [x, y] = pt(t, halfBand(t) * 0.7);
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  for (let i = NR; i >= 0; i--){
    const t = (i / NR) * cut;
    const [x, y] = pt(t, -halfBand(t) * 0.7);
    g.lineTo(x, y);
  }
  g.closePath();
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.fill();
})();

// --- BRISTLE FIBER (denser) ---
const NB = 46, NP = 220;
for (let b = 0; b < NB; b++){
  const u = (b / (NB - 1)) * 2 - 1;
  const edge = Math.abs(u);
  const seed = b * 3.17 + 1;
  const tEnd = Math.min(1, 1 - 0.14 * edge * rnd(seed));
  const tStart = 0.012 * edge * rnd(seed + 9);
  const over = edge > 0.72 && rnd(seed+4) > 0.6 ? 0.05 : 0;
  const width = 3.0 - 1.3 * edge + (rnd(seed+2) - 0.5);
  let drawing = false;
  for (let i = 0; i <= NP; i++){
    const t = i / NP;
    if (t < tStart || t > tEnd + over) { drawing = false; continue; }
    const hb = halfBand(t);
    const conv = 0.25 + 0.75 * Math.pow(1 - t, 0.7);
    const wob = Math.sin(t * 26 + seed * 4) * 2.0 * (0.4 + edge);
    const [x, y] = pt(t, u * hb * conv + wob);
    // dry gaps: fewer for inner bristles (wet core), more at outer + tail
    const dry = rnd(seed * 5 + i * 0.7);
    const gapThresh = 0.03 + 0.30 * edge + 0.16 * t;
    if (dry < gapThresh) { drawing = false; continue; }
    const a = (0.85 - 0.5 * t) * (0.55 + 0.45 * rnd(seed + i)) * (1 - 0.35 * edge);
    if (!drawing){ g.beginPath(); g.moveTo(x, y); drawing = true; }
    else {
      g.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      g.lineWidth = Math.max(0.7, width * (0.7 + 0.6 * rnd(seed + i * 2)));
      g.lineTo(x, y); g.stroke();
      g.beginPath(); g.moveTo(x, y);
    }
  }
}

// --- WET HEAD pooling (soft, no spikes) ---
(function(){
  const [hx, hy] = pt(0.05, 0);
  const grad = g.createRadialGradient(hx, hy, 4, hx, hy, BAND * 1.2);
  grad.addColorStop(0, 'rgba(255,255,255,0.6)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.22)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.beginPath(); g.arc(hx, hy, BAND * 1.2, 0, Math.PI * 2); g.fill();
})();

// --- INK POOLS: soft dark-ink blobs along the band (denser toward head) ---
for (let n = 0; n < 42; n++){
  const t = Math.pow(rnd(n * 1.7), 1.6);         // bias to head
  const hb = halfBand(t);
  const [x, y] = pt(t, (rnd(n * 2.9) - 0.5) * hb * 1.1);
  const rad = 10 + rnd(n * 3.3) * 40 * (1 - 0.5 * t);
  const a = 0.10 + 0.22 * rnd(n * 4.1) * (1 - 0.4 * t);
  const gr = g.createRadialGradient(x, y, 1, x, y, rad);
  gr.addColorStop(0, 'rgba(255,255,255,' + a.toFixed(3) + ')');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
}

// --- fine grain speckle ---
for (let n = 0; n < 9000; n++){
  const t = rnd(n * 1.3);
  const hb = halfBand(t);
  const [x, y] = pt(t, (rnd(n * 2.1) - 0.5) * 2 * hb);
  const a = 0.05 + 0.16 * rnd(n * 3.7) * (1 - 0.4 * t);
  g.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
  const s = 0.6 + rnd(n * 4.9) * 1.7;
  g.fillRect(x, y, s, s);
}
document.title = 'enso-ready';
</script>
</body></html>
